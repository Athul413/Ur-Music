name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Unzip project
        run: unzip -o offline_music.zip
      - name: Fix Router name clash
        run: |
          sed -i "s#import 'package:flutter/material.dart';#import 'package:flutter/material.dart' hide Router;#" offline_music/lib/server.dart
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generate Android project
        working-directory: offline_music
        run: flutter create . --org com.example --project-name offline_music --platforms=android && rm -rf test
      - name: Patch Android files
        working-directory: offline_music
        run: python3 tool/patch_android.py
      - name: Get packages
        working-directory: offline_music
        run: flutter pub get
      - name: Build APK
        working-directory: offline_music
        run: flutter build apk --release
      - uses: actions/upload-artifact@v5
        with:
          name: offline-music-apk
          path: offline_music/build/app/outputs/flutter-apk/app-release.apk
